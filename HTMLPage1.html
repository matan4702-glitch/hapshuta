            margin-bottom: 25px;
            font-size: 32px;

        /* Hebrew message */
        #message {
            font-family: "Segoe UI", sans-serif;
            font-size: 28px;
            font-weight: 600;
            margin-top: 25px;
            direction: rtl;
        }

        /* Heart button */
        .heart-button {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 45px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .heart-button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .heart-button:active {
            transform: scale(0.95);
        }

        #player-container {
            margin: 25px auto 0;
            width: 90%;
            max-width: 900px;
        }

        #player {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        #clipInfo {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 500;

    </style>

        function onYouTubeIframeAPIReady() {
            youtubeReady = true;
        }


        function chooseRandomVideo() {

            if (!youtubeReady) {
                alert("YouTube player is still loading. Please try again.");
                return;
            }

            const randomIndex =
                Math.floor(Math.random() * videos.length);

            selectedVideo = videos[randomIndex];


            if (stopTimer) {
                clearInterval(stopTimer);
                stopTimer = null;
            }


            document.getElementById("clipInfo").innerText =
                "Clip: " +
                formatTime(selectedVideo.start) +
                " - " +
                formatTime(selectedVideo.end);


            if (!player) {

                player = new YT.Player("player", {

                    videoId: selectedVideo.id,

                    playerVars: {
                        autoplay: 1,
                        controls: 1,
                        playsinline: 1,
                        rel: 0
                    },

                    events: {

                        onReady: function(event) {

                            event.target.loadVideoById({
                                videoId: selectedVideo.id,
                                startSeconds: selectedVideo.start
                            });

                            startStopTimer();
                        },

                        onStateChange: function(event) {

                            if (
                                event.data ===
                                YT.PlayerState.PLAYING
                            ) {
                                startStopTimer();
                            }
                        }
                    }
                });

            } else {

                player.loadVideoById({

                    videoId: selectedVideo.id,

                    startSeconds: selectedVideo.start
                });

                setTimeout(function() {
                    startStopTimer();
                }, 500);
            }
        }


        function startStopTimer() {

            if (stopTimer) {
                clearInterval(stopTimer);
            }

            stopTimer = setInterval(function() {

                if (!player || !selectedVideo) {
                    return;
                }

                const currentTime =
                    player.getCurrentTime();

                if (
                    currentTime >=
                    selectedVideo.end
                ) {

                    player.pauseVideo();

                    clearInterval(stopTimer);

                    stopTimer = null;
                }

            }, 100);
        }


        function formatTime(seconds) {

            const minutes =
                Math.floor(seconds / 60);

            const remainingSeconds =
                seconds % 60;

            return (
                minutes +
                ":" +
                String(remainingSeconds)
                    .padStart(2, "0")
            );
        }
