<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <button onclick="chooseRandomVideo()">
        Choose Random Video
    </button>

    <div id="result"></div>

    <script>

        const videos = [
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 131,
                end: 136
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 103,
                end: 119
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 119,
                end: 128
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 185,
                end: 192
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 192,
                end: 245
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 245,
                end: 273
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 284,
                end: 311
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 312,
                end: 323
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 373,
                end: 382
            },
            {
                url: "https://www.youtube.com/embed/iV2Syj2OwPQ",
                start: 406,
                end: 415
            }
        ];

        function chooseRandomVideo() {

            const randomIndex = Math.floor(Math.random() * videos.length);

            const selectedVideo = videos[randomIndex];

            const videoUrl =
                selectedVideo.url +
                "?start=" + selectedVideo.start +
                "&end=" + selectedVideo.end;

            document.getElementById("result").innerHTML = `
                    <a href="${videoUrl}" target="_blank">
                        ${videoUrl}
                    </a>
                `;
        }

    </script>

</body>
</html>
